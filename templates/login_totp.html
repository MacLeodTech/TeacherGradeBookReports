{% extends "base.html" %}
{% block title %}Verification code{% endblock %}
{% block body_class %}gb-login{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-sm-8 col-md-6 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4"><i class="bi bi-shield-lock"></i> Two-step verification</h1>
        <p class="text-muted">Enter the 6-digit code from your authenticator app.</p>
        <form method="post" action="/login/verify">
          <input type="hidden" name="csrf_token" value="{{ csrf }}">
          <input type="hidden" name="next" value="{{ next }}">
          <input class="form-control form-control-lg text-center mb-3" name="code" inputmode="numeric" pattern="[0-9 ]{6,7}" autocomplete="one-time-code" required autofocus>
          <button class="btn btn-primary w-100">Verify</button>
        </form>
        <form method="post" action="/logout" class="mt-3 text-center">
          <input type="hidden" name="csrf_token" value="{{ csrf }}">
          <button class="btn btn-link btn-sm">Cancel</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
