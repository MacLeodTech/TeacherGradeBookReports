name: Release

# On a version tag: publish the downloads and the image for that commit.
# Normally CI already tested and built that commit on main, so this only
# reuses its downloads and adds version tags to its image (a minute or two).
# If it didn't (the tag isn't on a commit CI built), it tests and builds here.
on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read

jobs:
  find:
    name: Find the CI run for this commit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          id=$(gh run list --workflow ci.yml --branch main --event push --commit "$GITHUB_SHA" \
                 --limit 1 --json databaseId -q '.[0].databaseId')
          if [ -z "$id" ]; then
            echo "::notice::CI didn't run on this commit on main; testing and building here."
            exit 0
          fi
          # A tag pushed straight after a merge arrives while CI is still running.
          if ! gh run watch "$id" --exit-status --interval 30 > /dev/null; then
            echo "::warning::CI run $id didn't pass; testing and building here."
            exit 0
          fi
          n=$(gh api "repos/$GH_REPO/actions/runs/$id/artifacts" \
                -q '[.artifacts[] | select(.expired | not) | select(.name | startswith("gradebook-"))] | length')
          if [ "$n" -lt 4 ]; then
            echo "::notice::CI run $id's downloads have expired; building here."
            exit 0
          fi
          echo "Reusing CI run $id: https://github.com/$GH_REPO/actions/runs/$id"
          echo "run_id=$id" >> "$GITHUB_OUTPUT"

  # Only when CI didn't already do it.
  test:
    needs: find
    if: needs.find.outputs.run_id == ''
    uses: ./.github/workflows/test.yml

  binaries:
    needs: [find, test]
    if: needs.find.outputs.run_id == '' && needs.test.result == 'success' && !cancelled()
    uses: ./.github/workflows/binaries.yml

  image:
    needs: [find, test]
    if: needs.find.outputs.run_id == '' && needs.test.result == 'success' && !cancelled()
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write

  # Normally: add the version tags to the image CI already pushed.
  tag-image:
    name: Add version tags to the image
    needs: find
    if: needs.find.outputs.run_id != ''
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/teachergradebookreports"
          v="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create \
            -t "$image:$v" -t "$image:${v%.*}" -t "$image:${v%%.*}" \
            "$image:sha-${GITHUB_SHA::7}"

  publish:
    name: Publish the release
    needs: [find, binaries]
    if: >-
      !cancelled() && needs.find.result == 'success' &&
      (needs.find.outputs.run_id != '' || needs.binaries.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: gradebook-*
          merge-multiple: true
          path: dist
          run-id: ${{ needs.find.outputs.run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
