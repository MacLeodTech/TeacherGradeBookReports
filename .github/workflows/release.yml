name: Release

# Publish the downloads and the image for a version tag.
#
# Normally CI calls this itself, right after it tags a merge to main (see
# "Releases" in ci.yml), passing its own run so the downloads it just built are
# reused: a minute or two. (A tag pushed with the workflow token doesn't start
# other workflows, which is why CI calls this rather than waiting for the tag.)
#
# Pushing a v*.*.* tag by hand also works: it reuses the CI run for that commit
# if there is one, otherwise tests and builds here.
on:
  push:
    tags: ["v*.*.*"]
  workflow_call:
    inputs:
      tag:
        description: "The tag to publish, already pushed (e.g. v2.3.0)"
        type: string
        required: true
      run_id:
        description: "The CI run whose downloads and image to reuse"
        type: string
        required: true

concurrency:
  group: release-${{ inputs.tag || github.ref }}

permissions:
  contents: read

jobs:
  find:
    name: Find the CI run for this commit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GIVEN_RUN_ID: ${{ inputs.run_id }}
        run: |
          if [ -n "$GIVEN_RUN_ID" ]; then
            echo "Reusing the calling CI run $GIVEN_RUN_ID"
            echo "run_id=$GIVEN_RUN_ID" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          id=$(gh run list --workflow ci.yml --branch main --event push --commit "$GITHUB_SHA" \
                 --limit 1 --json databaseId -q '.[0].databaseId')
          if [ -z "$id" ]; then
            echo "::notice::CI didn't run on this commit on main; testing and building here."
            exit 0
          fi
          # A tag pushed straight after a merge arrives while CI is still running.
          if ! gh run watch "$id" --exit-status --interval 30 > /dev/null; then
            echo "::warning::CI run $id didn't pass; testing and building here."
            exit 0
          fi
          n=$(gh api "repos/$GH_REPO/actions/runs/$id/artifacts" \
                -q '[.artifacts[] | select(.expired | not) | select(.name | startswith("gradebook-"))] | length')
          if [ "$n" -lt 4 ]; then
            echo "::notice::CI run $id's downloads have expired; building here."
            exit 0
          fi
          echo "Reusing CI run $id: https://github.com/$GH_REPO/actions/runs/$id"
          echo "run_id=$id" >> "$GITHUB_OUTPUT"

  # Only when CI didn't already do it. The binaries jobs run the tests.
  binaries:
    needs: find
    if: needs.find.outputs.run_id == ''
    uses: ./.github/workflows/binaries.yml
    with:
      version: ${{ github.ref_name }}

  image:
    needs: [find, binaries]
    if: needs.find.outputs.run_id == '' && needs.binaries.result == 'success' && !cancelled()
    uses: ./.github/workflows/image.yml
    with:
      version: ${{ github.ref_name }}
    permissions:
      contents: read
      packages: write

  # Normally: add the version tags to the image CI already pushed.
  tag-image:
    name: Add version tags to the image
    needs: find
    if: needs.find.outputs.run_id != ''
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/teachergradebookreports"
          v="${TAG#v}"
          docker buildx imagetools create \
            -t "$image:$v" -t "$image:${v%.*}" -t "$image:${v%%.*}" \
            "$image:sha-${GITHUB_SHA::7}"

  publish:
    name: Publish the release
    needs: [find, binaries]
    if: >-
      !cancelled() && needs.find.result == 'success' &&
      (needs.find.outputs.run_id != '' || needs.binaries.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: gradebook-*
          merge-multiple: true
          path: dist
          run-id: ${{ needs.find.outputs.run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          ls -l dist
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes --verify-tag
          fi
