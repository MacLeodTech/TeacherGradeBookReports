name: Binaries

# Build `gradebook` for teachers' own computers and keep each one as a run
# artifact. Called by CI on main (so a release only has to publish them) and
# by the release workflow when CI didn't build the tagged commit.
on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x64, exe: gradebook.exe }
          - { os: macos-latest, target: aarch64-apple-darwin, name: macos-arm64, exe: gradebook }
          - { os: macos-latest, target: x86_64-apple-darwin, name: macos-x64, exe: gradebook }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, name: linux-x64, exe: gradebook }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          bin="target/${{ matrix.target }}/release/${{ matrix.exe }}"
          if [ "$RUNNER_OS" = Windows ]; then
            7z a "dist/gradebook-${{ matrix.name }}.zip" "./$bin"
          else
            tar -C "$(dirname "$bin")" -czf "dist/gradebook-${{ matrix.name }}.tar.gz" "${{ matrix.exe }}"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: gradebook-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0  # already compressed
          retention-days: 30
