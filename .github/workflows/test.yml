name: Test

# Format, lint and test on every OS the app ships for. Called by CI, and by
# the release workflow when a tagged commit wasn't already tested on main.
on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # No debug info in test builds: faster linking and a smaller cache.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: Test (${{ matrix.os }})
    # The repo is public: GitHub-hosted runners only.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux for the Docker image; Windows and macOS for `gradebook local`.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust
        id: rust
        shell: bash
        run: |
          components=""
          [ "$RUNNER_OS" = Linux ] && components="--component clippy,rustfmt"
          rustup toolchain install stable --profile minimal $components && rustup default stable
          echo "version=$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      # Keyed on the Rust version and Cargo.lock. Saved only from main: caches
      # saved on a PR or tag can't be read anywhere else, and only use up space.
      - name: Restore the build cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: test-${{ runner.os }}-rust${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: test-${{ runner.os }}-rust${{ steps.rust.outputs.version }}-

      # Formatting and lints don't depend on the OS, so they run once.
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Lint
        if: runner.os == 'Linux'
        run: cargo clippy --locked --all-targets -- -D clippy::correctness -D clippy::suspicious

      - name: Test
        run: cargo test --locked

      - name: Save the build cache
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cache.outputs.cache-primary-key }}
