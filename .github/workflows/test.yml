name: Test

# Format, lint and test on every OS the app ships for. Called by CI, and by
# the release workflow when a tagged commit wasn't already tested on main.
on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # No debug info in test builds: faster linking and a smaller cache.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  test:
    name: Test (${{ matrix.os }})
    # The repo is public: GitHub-hosted runners only.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux for the Docker image; Windows and macOS for `gradebook local`.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust
        shell: bash
        run: |
          components=""
          [ "$RUNNER_OS" = Linux ] && components="--component clippy,rustfmt"
          rustup toolchain install stable --profile minimal $components && rustup default stable

      # Caches only dependencies, keyed on Cargo.lock, and saves only from main
      # (caches from PRs and tags can't be reused, so saving them wastes the quota).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Formatting and lints don't depend on the OS, so they run once.
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Lint
        if: runner.os == 'Linux'
        run: cargo clippy --locked --all-targets -- -D clippy::correctness -D clippy::suspicious

      - name: Test
        run: cargo test --locked
