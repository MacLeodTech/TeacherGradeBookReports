services:
  app:
    build: .
    # Or use the published image:
    # image: ghcr.io/macleodtech/teachergradebookreports:latest
    container_name: grade-reports
    ports:
      - "8000:8000"
    volumes:
      # Holds gradebook.db and backups/. With STORAGE=memory (the default) that
      # is only accounts, settings, comment banks and the audit log; with
      # STORAGE=persistent it also holds classes, students and marks.
      # Upgrading from the Python version: keep the same volume; accounts in
      # the old users.db are imported automatically on first start.
      - grade-reports-data:/data
    env_file: .env
    environment:
      TZ: ${TZ:-America/Toronto}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=256m
    restart: unless-stopped

volumes:
  grade-reports-data:
